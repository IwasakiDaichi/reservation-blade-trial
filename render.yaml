services:
  - type: web
    name: reservation-blade-trial
    runtime: docker
    branch: 11/16-deploy
    region: singapore
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /up
    envVars:
      - key: APP_NAME
        value: Reservation Blade Trial
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        sync: false
      - key: TRUSTED_PROXIES
        value: "*"
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        fromDatabase:
          name: reservation-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: reservation-db
          property: port
      - key: DB_DATABASE
        fromDatabase:
          name: reservation-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: reservation-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: reservation-db
          property: password
      - key: SESSION_DRIVER
        value: database
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: sync
      - key: FILESYSTEM_DISK
        value: local
      - key: MAIL_MAILER
        value: log
      - key: LOG_CHANNEL
        value: stderr

databases:
  - name: reservation-db
    databaseName: reservation
    user: reservation
    plan: free
    region: singapore
    postgresMajorVersion: "17"
